[project]
name = "pyqt-video-inspector"
version = "0.1.0"
description = "Simple video display and RGB histogram analysis with PyQt"
readme = "README.md"
authors = [
    { name = "mhas1381", email = "mhas.software@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "PyQt6>=6.7",
    "opencv-python>=4.10",
    "numpy>=2.0",
]

[project.scripts]
pyqt-video-inspector = "main:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["main", "main_window", "frame_view", "histogram_window", "video_model"]
packages = ["assets"]

[tool.setuptools.package-data]
assets = ["*.png", "*.ico"]

[tool.pyright]
extraPaths = ["src"]
